# Zephyr / nRF Connect SDK configuration (nice!nano / nRF52840)

# Hardware and GPIO configuration
CONFIG_GPIO=y

# UF2 image generation for nice!nano bootloader
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_BUILD_OUTPUT_UF2_FAMILY_ID="0xada52840"
CONFIG_USE_DT_CODE_PARTITION=n
CONFIG_FLASH_LOAD_OFFSET=0x1000

# Bluetooth stack (BLE) - Multi-Identity architecture (3x peripheral + 1x central)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y

CONFIG_BT_MAX_CONN=4
CONFIG_BT_ID_MAX=3
CONFIG_BT_CTLR_SDC_PERIPHERAL_COUNT=3

CONFIG_BT_DEVICE_NAME="TactSuitX40"
CONFIG_BT_DEVICE_APPEARANCE=509

CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=3

CONFIG_BT_GAP_SVC=n

# Security and SMP (required for Meta Quest pairing)
CONFIG_BT_SMP=y

CONFIG_BT_BONDABLE=n
CONFIG_BT_SETTINGS=n

CONFIG_BT_SMP_SC_PAIR_ONLY=n
CONFIG_BT_SMP_ENFORCE_MITM=n
CONFIG_BT_SMP_MIN_ENC_KEY_SIZE=7
CONFIG_BT_GATT_AUTO_SEC_REQ=n
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y

CONFIG_BT_ID_UNPAIR_MATCHING_BONDS=n

# GATT parameters, buffers and MTU
CONFIG_BT_GATT_AUTO_UPDATE_MTU=n

CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y

CONFIG_BT_L2CAP_TX_MTU=128
CONFIG_BT_BUF_ACL_RX_SIZE=132
CONFIG_BT_BUF_ACL_TX_SIZE=132
CONFIG_BT_BUF_ACL_TX_COUNT=14
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=5

# USB stack and console (CDC ACM)
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_DEVICE_PRODUCT="nice!nano CDC ACM"

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Persistent settings (Settings / NVS)
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# RTOS stack sizes
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=4096
